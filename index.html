<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>請選擇服務 | Club Med 線上諮詢表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,700;6..72,800&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@700;800&display=swap" rel="stylesheet">
  <link href="assets/css/common.css" rel="stylesheet" type="text/css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="https://www.clubmed.com.tw" target="_blank" rel="noopener noreferrer" class="site-logo" aria-label="Club Med 台灣官網">
        <img src="assets/images/top_logo.jpg" alt="Club Med">
      </a>
      <a href="tel:0800258263" class="site-phone" aria-label="撥打客服專線 0800-258-263">
        <svg class="site-phone__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z" />
        </svg>
        <span>0800-258-263</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero-kv hero-kv--ultramarine">
      <div class="hero-kv__ribbon" aria-hidden="true">
        <svg viewBox="0 0 800 420" preserveAspectRatio="xMaxYMid slice" fill="none">
          <g stroke="#FDBE00" stroke-width="11" stroke-linecap="round">
            <path d="M-40 380 C 120 120, 340 420, 520 160 C 610 30, 740 80, 700 220 C 660 350, 520 260, 620 140 C 690 55, 780 90, 860 170" />
            <path d="M-20 400 C 140 140, 360 440, 540 180 C 630 50, 760 100, 720 240 C 680 370, 540 280, 640 160 C 710 75, 800 110, 880 190" />
            <path d="M0 420 C 160 160, 380 460, 560 200 C 650 70, 780 120, 740 260 C 700 390, 560 300, 660 180 C 730 95, 820 130, 900 210" />
          </g>
        </svg>
      </div>
      <div class="hero-kv__inner">
        <p class="hero-kv__eyebrow">Club Med Taiwan · Online Concierge</p>
        <h1 class="hero-kv__title">Club Med 線上諮詢表</h1>
        <p class="hero-kv__subtitle">請選擇您需要的服務項目，由專屬旅遊顧問為您打造精緻全包式假期。</p>
      </div>
    </section>

    <div class="page-shell">
      <nav class="service-grid" aria-label="服務項目導覽">
        <a href="contactus1/index.html" class="service-card">
          <span class="service-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </svg>
          </span>
          <h2 class="service-card__title">旅遊行前須知 / 度假村資訊</h2>
          <p class="service-card__desc">瀏覽全球 20 座精選度假村的行前須知、設施介紹與出發注意事項（PDF）。</p>
          <span class="service-card__cta">
            <span>前往查閱</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
        </a>

        <a href="contactus2/index.html" class="service-card">
          <span class="service-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <h2 class="service-card__title">行程報價</h2>
          <p class="service-card__desc">填寫預計出發日期、天數、人數與度假村偏好，由旅遊顧問為您客製報價。</p>
          <span class="service-card__cta">
            <span>填寫報價單</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
        </a>

        <a href="contactus3/index.html" class="service-card">
          <span class="service-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
          </span>
          <h2 class="service-card__title">提交訂位委託書</h2>
          <p class="service-card__desc">已確認假期與同行旅客護照資料？線上提交訂位委託書，加速完成預訂。</p>
          <span class="service-card__cta">
            <span>開始填寫</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
        </a>
      </nav>
    </div>
  </main>

  <footer class="site-footer">
    &copy;2026 Club Med All Rights Reserved.
  </footer>
</body>

</html>
