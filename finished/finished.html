<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5;url=https://www.clubmed.com.tw">
  <title>已送出 | Club Med</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,700;6..72,800&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@700;800&display=swap" rel="stylesheet">
  <link href="../assets/css/common.css" rel="stylesheet" type="text/css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="https://www.clubmed.com.tw" class="site-logo" aria-label="Club Med 台灣官網">
        <img src="../assets/images/top_logo.jpg" alt="Club Med">
      </a>
      <a href="tel:0800258263" class="site-phone" aria-label="撥打客服專線 0800-258-263">
        <svg class="site-phone__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z" />
        </svg>
        <span>0800-258-263</span>
      </a>
    </div>
  </header>

  <main class="finished-hero">
    <div class="hero-kv__ribbon" aria-hidden="true">
      <svg viewBox="0 0 800 420" preserveAspectRatio="xMaxYMid slice" fill="none">
        <g stroke="#F6EFE7" stroke-width="11" stroke-linecap="round">
          <path d="M-20 350 C 120 260, 260 390, 400 220 C 520 75, 680 120, 820 40" />
          <path d="M-8 372 C 132 282, 272 412, 412 242 C 532 97, 692 142, 832 62" />
          <path d="M4 394 C 144 304, 284 434, 424 264 C 544 119, 704 164, 844 84" />
        </g>
      </svg>
    </div>
    <div class="finished-card">
      <h1 class="finished-card__title">我們已經收到您的訊息</h1>
      <p class="finished-card__desc">Club Med 旅遊顧問將在二個工作天內與您聯繫，謝謝。</p>
      <p class="finished-card__countdown">
        頁面將於 <strong id="countdown">5</strong> 秒後自動返回 Club Med 台灣官網
      </p>
      <div class="finished-actions">
        <a href="https://www.clubmed.com.tw" class="btn-main-cta">立即前往 Club Med 官網</a>
        <a href="../index.html" class="btn-outline-light">返回線上諮詢首頁</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    &copy;2026 Club Med All Rights Reserved.
  </footer>

  <script>
    (function () {
      var seconds = 5;
      var el = document.getElementById("countdown");
      var timer = window.setInterval(function () {
        seconds -= 1;
        if (el && seconds >= 0) {
          el.textContent = String(seconds);
        }
        if (seconds <= 0) {
          window.clearInterval(timer);
        }
      }, 1000);
    })();
  </script>
</body>

</html>
